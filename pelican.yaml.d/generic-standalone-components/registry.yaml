TLSSkipVerify: true

# See director.yaml for why the root-hardcoded paths are pinned explicitly.
ConfigBase: /workspaces/pelican/pfed/srv/registry/config
RuntimeDir: /workspaces/pelican/pfed/srv/registry/run

Logging:
  Level: debug

Server:
  # All four services share one CA so that XRootD (which ignores TLSSkipVerify)
  # can verify the other services' certificates.
  TLSCACertificateFile: /workspaces/pelican/pfed/srv/shared-ca/tlsca.pem
  TLSCAKey: /workspaces/pelican/pfed/srv/shared-ca/tlsca.key
  Hostname: localhost
  WebPort: 8442
  EnableUI: true
  DbLocation: /workspaces/pelican/pfed/srv/registry/data/pelican.sqlite
  DatabaseBackup:
    Location: /workspaces/pelican/pfed/srv/registry/data/backups

Monitoring:
  DataLocation: /workspaces/pelican/pfed/srv/registry/data/monitoring

Federation:
  DirectorUrl: https://localhost:8441
